name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20

jobs:
  quality:
    name: Lint, format, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run prisma:generate -w @devhub/api
      - run: npm run build -w @devhub/shared
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  test-api:
    name: API tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: devhub, POSTGRES_PASSWORD: devhub, POSTGRES_DB: devhub_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U devhub" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      TEST_DATABASE_URL: postgresql://devhub:devhub@localhost:5432/devhub_test?schema=public
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run prisma:generate -w @devhub/api
      - run: npm run build -w @devhub/shared
      - run: npm test -w @devhub/shared
      - run: npm test -w @devhub/api
      - run: npm test -w @devhub/runner
      - name: Schema drift check (migrations must match schema.prisma)
        working-directory: apps/api
        env: { DATABASE_URL: '${{ env.TEST_DATABASE_URL }}' }
        run: ./scripts/check-drift.sh

  test-web:
    name: Web unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run build -w @devhub/shared
      - run: npm test -w @devhub/web
      - run: npm run build -w @devhub/web

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [test-api, test-web]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: devhub, POSTGRES_PASSWORD: devhub, POSTGRES_DB: devhub }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U devhub" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ['1025:1025', '8025:8025']
    env:
      DATABASE_URL: postgresql://devhub:devhub@localhost:5432/devhub?schema=public
      REDIS_URL: redis://localhost:6379
      SMTP_URL: smtp://localhost:1025
      JWT_ACCESS_SECRET: ci-only-secret-0123456789abcdefghijklmnopqrstuvwxyz
      RATE_LIMITS_ENABLED: 'false'
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run prisma:generate -w @devhub/api
      - run: npm run build -w @devhub/shared
      - run: npm run prisma:migrate -w @devhub/api
      - run: npm run seed -w @devhub/api
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run e2e -w @devhub/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          {
            context: .,
            file: apps/api/Dockerfile,
            push: false,
            cache-from: type=gha,
            cache-to: 'type=gha,mode=max',
          }
      - uses: docker/build-push-action@v6
        with:
          {
            context: .,
            file: apps/runner/Dockerfile,
            push: false,
            cache-from: type=gha,
            cache-to: 'type=gha,mode=max',
          }
      - uses: docker/build-push-action@v6
        with:
          {
            context: .,
            file: apps/web/Dockerfile,
            push: false,
            cache-from: type=gha,
            cache-to: 'type=gha,mode=max',
          }
