# Least-privilege networking (enforced by CNIs that support NetworkPolicy, e.g. Calico, Cilium).
# The runner accepts traffic only from the API and may not open any connection itself:
# user code cannot reach the internet, the database, Redis or the cloud metadata endpoint.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: runner-isolation
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: runner }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: api }
      ports: [{ port: 2000 }]
  egress: [] # nothing, not even DNS
---
# Only the web tier and the ingress controller may call the API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-ingress
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: api }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: web }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
      ports: [{ port: 4000 }]
