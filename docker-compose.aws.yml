# DevHub+ on AWS EC2 (t4g.small, 2 GB RAM).
# Full stack in containers: Postgres + pgvector, Redis, API, web, runner.
# Total cost: ~$16/month (EC2 + 15 GB EBS + EIP).
#
# Usage:
#   1. Copy env.aws.example to .env.aws and fill in values
#   2. docker compose -f docker-compose.aws.yml up --build -d

name: devhub-aws

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: devhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devhub}
      POSTGRES_DB: devhub
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ['127.0.0.1:5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devhub -d devhub']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 256m
    shm_size: 64m
    command: >
      postgres
        -c shared_buffers=64MB
        -c work_mem=4MB
        -c maintenance_work_mem=32MB
        -c effective_cache_size=128MB
        -c max_connections=50
        -c shared_preload_libraries=vector

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec', '--maxmemory', '128mb', '--maxmemory-policy', 'allkeys-lru']
    volumes: [redisdata:/data]
    ports: ['127.0.0.1:6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 192m

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env.aws
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://devhub:${POSTGRES_PASSWORD:-devhub}@postgres:5432/devhub?schema=public
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: 1
      COOKIE_SECURE: 'true'
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      CODE_RUNNER_URL: http://runner:2000
    ports: ['127.0.0.1:4000:4000']
    networks: [default, sandbox]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      runner: { condition: service_started }
    restart: unless-stopped
    mem_limit: 384m

  runner:
    build: { context: ., dockerfile: apps/runner/Dockerfile }
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN:-devhub-runner-prod-token}
      RUNNER_CONCURRENCY: 2
      RUNNER_MAX_PROCS: 64
    init: true
    networks: [sandbox]
    read_only: true
    tmpfs: ['/tmp:size=48m,mode=1777,nosuid,nodev']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 96
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile.aws }
    ports: ['127.0.0.1:8080:8080']
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    mem_limit: 128m

networks:
  sandbox:
    internal: true

volumes:
  pgdata:
  redisdata:
