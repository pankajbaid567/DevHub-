# Full DevHub+ stack:  cp .env.example .env && docker compose up --build
# Then open http://localhost:8080 (demo login: ada@devhub.dev / password123).
#
# Scale the API horizontally (Socket.IO rooms, cache and rate limits are shared through Redis;
# nginx keeps each client on one replica):  docker compose up --build --scale api=3

name: devhub

services:
  postgres:
    # Postgres 16 with the pgvector extension (semantic search / RAG embeddings).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: devhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devhub}
      POSTGRES_DB: devhub
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devhub -d devhub']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # AOF persistence: Redis now holds queued background jobs, not just cache.
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec']
    volumes: [redisdata:/data]
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Local SMTP sink: every email the app sends shows up at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['8025:8025', '1025:1025']

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://devhub:${POSTGRES_PASSWORD:-devhub}@postgres:5432/devhub?schema=public
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${PUBLIC_URL:-http://localhost:8080}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env (openssl rand -base64 48)}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: 1
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
      MAIL_FROM: ${MAIL_FROM:-DevHub+ <no-reply@devhub.dev>}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      CODE_RUNNER_URL: ${CODE_RUNNER_URL:-http://runner:2000}
      RUNNER_TOKEN: ${RUNNER_TOKEN:-devhub-runner-local-token}
    networks: [default, sandbox]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      runner: { condition: service_started }
    restart: unless-stopped

  # Sandboxed code execution for sessions. Defence in depth: reachable only from the API on an
  # internal network with no internet route; read-only root filesystem; every Linux capability
  # dropped; no privilege escalation; memory, CPU and process-count caps; tiny tmpfs.
  runner:
    build: { context: ., dockerfile: apps/runner/Dockerfile }
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN:-devhub-runner-local-token}
      RUNNER_CONCURRENCY: 2
      RUNNER_MAX_PROCS: 96
    # tini as PID 1 reaps orphaned/zombie processes left by killed programs.
    init: true
    networks: [sandbox]
    read_only: true
    tmpfs: ['/tmp:size=64m,mode=1777,nosuid,nodev']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports: ['8080:8080']
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  # Observability (opt-in): docker compose --profile observability up -d
  # Prometheus at http://localhost:9090, Grafana at http://localhost:3001 (anonymous viewer).
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ['9090:9090']

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/devhub-overview.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['3001:3000']
    depends_on: [prometheus]

networks:
  # internal: true means no gateway, so containers on it cannot reach the internet.
  sandbox:
    internal: true

volumes:
  pgdata:
  redisdata:
