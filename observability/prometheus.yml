# Scrapes every API replica: Docker's embedded DNS returns one A record per replica of the
# `api` service, so `docker compose up --scale api=N` is discovered automatically.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: devhub-api
    metrics_path: /metrics
    dns_sd_configs:
      - names: [api]
        type: A
        port: 4000
        refresh_interval: 10s

rule_files: [/etc/prometheus/alerts.yml]
