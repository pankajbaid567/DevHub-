# Alerting rules (SLO-style). Wire Alertmanager to page on these in a real deployment.
groups:
  - name: devhub
    rules:
      - alert: ApiReplicaDown
        expr: up{job="devhub-api"} == 0
        for: 1m
        labels: { severity: page }
        annotations: { summary: 'API replica {{ $labels.instance }} is not responding to scrapes' }

      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_requests_total[5m])), 1) > 0.02
        for: 5m
        labels: { severity: page }
        annotations: { summary: 'More than 2% of API requests are failing (5xx)' }

      - alert: SlowRequests
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 10m
        labels: { severity: ticket }
        annotations: { summary: 'API p95 latency above 500 ms for 10 minutes' }

      - alert: JobsFailing
        expr: sum(rate(jobs_total{outcome="error"}[10m])) > 0.1
        for: 10m
        labels: { severity: ticket }
        annotations: { summary: 'Background jobs are failing repeatedly (check the failed set)' }

      - alert: AiDegraded
        expr: |
          sum(rate(ai_requests_total{outcome="error"}[10m]))
            / clamp_min(sum(rate(ai_requests_total[10m])), 0.001) > 0.2
        for: 10m
        labels: { severity: ticket }
        annotations: { summary: 'More than 20% of AI calls are failing (both models)' }
