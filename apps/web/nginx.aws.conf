# AWS deployment: ALB handles /api/* and /socket.io/* routing to the API service.
# This nginx config only serves the static SPA — no upstream proxy needed.

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  include /etc/nginx/snippets/security-headers.conf;

  location = /healthz { access_log off; return 200 "ok"; }

  # Content-hashed assets: cache for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # SPA fallback: unknown paths render index.html (never cached).
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
