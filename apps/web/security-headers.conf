# Included by nginx.conf in the server block and in every location with its own add_header.
# CSP: same-origin scripts only (no inline), Google Fonts, Monaco workers from blob: URLs,
# same-origin WebSockets; no framing.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Cross-Origin-Opener-Policy same-origin always;
# Calls need camera, microphone and screen capture on our own origin only.
add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;
