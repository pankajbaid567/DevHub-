# Edge for DevHub+: static SPA + reverse proxy to one or more API replicas.
upstream devhub_api {
  # ip_hash keeps a client on one replica, required by Socket.IO's HTTP long-polling
  # fallback (WebSocket-only clients would not need it). Docker DNS resolves `api` to
  # every replica when scaled with `docker compose up --scale api=N`.
  ip_hash;
  server api:4000;
  keepalive 32;
  # Must be shorter than the API's keepAliveTimeout (65 s): otherwise Node may close an idle
  # connection just as nginx reuses it, and non-idempotent requests (POST) fail with a 502.
  keepalive_timeout 30s;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  # Security headers live in a snippet because nginx drops inherited add_header directives
  # in any location that declares its own; every such location includes it again.
  include /etc/nginx/snippets/security-headers.conf;

  location = /healthz { access_log off; return 200 "ok"; }

  location /api/ {
    proxy_pass http://devhub_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    # Server-sent events (AI mentor streaming) must not be buffered.
    proxy_buffering off;
    proxy_read_timeout 120s;
    client_max_body_size 3m;
  }

  location /socket.io/ {
    proxy_pass http://devhub_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 1h;
  }

  location ~ ^/(docs|openapi\.json) {
    proxy_pass http://devhub_api;
    proxy_set_header Host $host;
  }

  # Content-hashed assets: cache for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # SPA fallback: unknown paths render index.html (never cached).
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
