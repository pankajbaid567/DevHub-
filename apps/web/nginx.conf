# Edge for DevHub+: static SPA + reverse proxy to one or more API replicas.
upstream devhub_api {
  # ip_hash keeps a client on one replica, required by Socket.IO's HTTP long-polling
  # fallback (WebSocket-only clients would not need it). Docker DNS resolves `api` to
  # every replica when scaled with `docker compose up --scale api=N`.
  ip_hash;
  server api:4000;
  keepalive 32;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  # Security headers. The CSP allows only our own origin (plus Google Fonts and the
  # Monaco web workers created from blob: URLs).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /healthz { access_log off; return 200 "ok"; }

  location /api/ {
    proxy_pass http://devhub_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    # Server-sent events (AI mentor streaming) must not be buffered.
    proxy_buffering off;
    proxy_read_timeout 120s;
    client_max_body_size 3m;
  }

  location /socket.io/ {
    proxy_pass http://devhub_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 1h;
  }

  location ~ ^/(docs|openapi\.json) {
    proxy_pass http://devhub_api;
    proxy_set_header Host $host;
  }

  # Content-hashed assets: cache for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: unknown paths render index.html (never cached).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
